name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m py_compile bin/tunarchy
      - run: python3 -m unittest discover -s tests -v

  release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 tests/validate_manifest.py
      - run: node --test tests/test_model.js
      - name: Install QML syntax tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qt6-declarative-dev-tools
      - name: Parse and format-check QML
        run: qmlformat Panel.qml >/dev/null
